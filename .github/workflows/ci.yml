name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The e2e job (full dev stack) runs on demand: Actions → CI → Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  api-contract:
    # Fails until silopost/silo-server is public and has the ref declared in
    # package.json ("silo.serverRef"); see README, "API contract".
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read declared server ref
        id: ref
        run: echo "ref=$(node -p "require('./package.json').silo.serverRef")" >> "$GITHUB_OUTPUT"
      - name: Check out silo-server
        uses: actions/checkout@v4
        with:
          repository: silopost/silo-server
          ref: ${{ steps.ref.outputs.ref }}
          path: server
      - run: npm run gen:api -- --local server/api/openapi.yaml
      - name: Verify committed schema matches the server contract
        run: git diff --exit-code -- src/api/schema.d.ts

  e2e:
    # Playwright on the full dev stack of silo/docker-compose.dev.yml (plan 7, Faza 3 DoD).
    # Heavy (docker-mailserver, initial sync of 5000 threads), so only on workflow_dispatch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: silo-web
      - uses: actions/checkout@v4
        with:
          repository: silopost/silo
          path: silo
      - name: Read declared server ref
        id: ref
        run: echo "ref=$(node -p "require('./silo-web/package.json').silo.serverRef")" >> "$GITHUB_OUTPUT"
      - name: Check out silo-server at the declared ref
        uses: actions/checkout@v4
        with:
          repository: silopost/silo-server
          ref: ${{ steps.ref.outputs.ref }}
          path: silo-server
      - uses: actions/setup-node@v4
        with:
          node-version-file: silo-web/.nvmrc
          cache: npm
          cache-dependency-path: silo-web/package-lock.json
      - run: npm ci
        working-directory: silo-web
      - run: npx playwright install --with-deps chromium
        working-directory: silo-web
      - name: Start the dev stack (without the Vite container)
        run: bash silo/scripts/dev-up.sh postgres mailserver silo-server
      - name: Seed mail
        run: bash silo/scripts/seed-mail.sh --all
      - run: npm run e2e
        working-directory: silo-web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            silo-web/playwright-report
            silo-web/test-results
      - if: failure()
        run: docker compose -f silo/docker-compose.dev.yml logs --tail=300 silo-server mailserver

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/silopost/silo-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push only on main; pull requests just verify that the image builds.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
