name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  api-contract:
    # Fails until silopost/silo-server is public and has the ref declared in
    # package.json ("silo.serverRef"); see README, "API contract".
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read declared server ref
        id: ref
        run: echo "ref=$(node -p "require('./package.json').silo.serverRef")" >> "$GITHUB_OUTPUT"
      - name: Check out silo-server
        uses: actions/checkout@v4
        with:
          repository: silopost/silo-server
          ref: ${{ steps.ref.outputs.ref }}
          path: server
      - run: npm run gen:api -- --local server/api/openapi.yaml
      - name: Verify committed schema matches the server contract
        run: git diff --exit-code -- src/api/schema.d.ts

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/silopost/silo-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push only on main; pull requests just verify that the image builds.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
